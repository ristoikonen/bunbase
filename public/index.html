<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatAndBun — Secure AI Gateway</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      color: #38bdf8;
    }
    #quota-badge {
      font-size: 0.875rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid #334155;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .message {
      padding: 1rem;
      border-radius: 0.75rem;
      max-width: 75%;
      line-height: 1.5;
      word-break: break-word;
    }
    .message.user {
      background-color: #3b82f6;
      color: white;
      align-self: flex-end;
    }
    .message.gemini {
      background-color: #1e293b;
      border: 1px solid #334155;
      align-self: flex-start;
    }
    .message.system {
      background-color: #334155;
      color: #cbd5e1;
      align-self: center;
      font-size: 0.875rem;
    }
    footer {
      background-color: #1e293b;
      padding: 1rem 2rem;
      border-top: 1px solid #334155;
    }
    #chat-form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
    }
    #prompt-input {
      flex: 1;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    #prompt-input:focus {
      border-color: #38bdf8;
    }
    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <header>
    <h1>ChatAndBun (Chattish)</h1>
    <div id="quota-badge">Loading Quota...</div>
  </header>

  <div id="chat-container">
    <div class="message system">Welcome! Connected to Bun AI Gateway using Gemini 2.5 Flash.</div>
  </div>

  <footer>
    <form id="chat-form">
      <input type="text" id="prompt-input" placeholder="Type your prompt here..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatForm = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt-input");
    const quotaBadge = document.getElementById("quota-badge");

    const sessionId = crypto.randomUUID();

    function appendMessage(sender, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${sender.toLowerCase().includes("user") ? "user" : sender.toLowerCase().includes("system") ? "system" : "gemini"}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function updateQuotaDisplay(remaining) {
      quotaBadge.textContent = `Remaining Quota: ${remaining}`;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      promptInput.value = "";
      appendMessage("User", prompt);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Session-ID": sessionId
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (data.success) {
          appendMessage("Gemini AI", data.reply);
          if (data.remainingQuota !== undefined) {
            updateQuotaDisplay(data.remainingQuota);
          }
        } else {
          appendMessage("System", `Error: ${data.error}`);
        }
      } catch (err) {
        appendMessage("System", "Failed to communicate with Bun backend.");
      }
    });
  </script>
</body>
</html>
